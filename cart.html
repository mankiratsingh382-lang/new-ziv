<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Review your ZIVARR cart, check the pieces in your order, and continue to a secure premium checkout flow." />
  <meta name="robots" content="index,follow" />
  <meta name="author" content="ZIVARR" />
  <meta property="og:title" content="ZIVARR Cart | Luxury Jewellery" />
  <meta property="og:description" content="See your selected ZIVARR jewellery before you continue to checkout." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://zivarr.vercel.app/cart.html" />
  <meta property="og:image" content="https://zivarr.vercel.app/images/IMG_6489.JPG" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#b0505c" />
  <link rel="canonical" href="https://zivarr.vercel.app/cart.html" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>ZIVARR Cart | Luxury Jewellery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-shell{min-height:100svh;padding:110px 24px 72px;background:linear-gradient(180deg,#fffafc 0%, #fff 45%, #fff7f8 100%);}
    .page-wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;}
    .glass-panel{background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border:1px solid rgba(212,114,126,.18);border-radius:28px;box-shadow:0 18px 50px rgba(61,24,32,.08);padding:24px;}
    .eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--pink-mid);}
    .title{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,6vw,56px);color:var(--rose-dark);margin-top:8px;}
    .muted{color:var(--text-muted);font-size:13px;line-height:1.8;}
    .summary-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(212,114,126,.12);}
    .summary-row strong{color:var(--rose-dark);font-family:'Cormorant Garamond',serif;font-size:20px;}
    .tag{display:inline-flex;gap:8px;align-items:center;padding:8px 10px;border-radius:999px;background:rgba(181,80,92,.12);color:var(--rose-mid);font-size:9px;letter-spacing:2px;text-transform:uppercase;}
    .cart-item-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid rgba(212,114,126,.12);}
    .cart-item-details{flex:1;}
    .cart-item-name{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--rose-dark);font-weight:500;}
    .cart-item-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .cart-item-controls{display:flex;align-items:center;gap:8px;}
    .qty-button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(212,114,126,.25);background:rgba(255,255,255,.85);color:var(--rose-dark);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
    .qty-button:hover{background:rgba(245,213,218,.65);}
    .qty-value{font-size:14px;font-weight:500;min-width:20px;text-align:center;color:var(--rose-dark);}
    .cart-item-total{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--rose-dark);min-width:80px;text-align:right;}
    .remove-item{background:none;border:none;color:var(--pink-mid);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;padding:6px 0;transition:color .2s;}
    .remove-item:hover{color:var(--pink-deep);}
    .empty-cart{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;line-height:1.8;}
    .empty-cart::before{content:'✦';display:block;font-size:36px;margin-bottom:16px;color:var(--pink-soft);}
    .shipping-note{font-size:11px;color:var(--text-muted);margin-top:6px;font-style:italic;}
    .total-row{border-top:2px solid rgba(212,114,126,.2);padding-top:14px;margin-top:8px;}
    .total-row strong{font-size:24px;}
    .cart-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
    @media (max-width:980px){.page-wrap{grid-template-columns:1fr;}.cart-item-row{flex-wrap:wrap;gap:12px;}.cart-item-total{min-width:auto;}}
  </style>
</head>
<body>
  <div id="cur"></div><div id="cur-r"></div>
  <nav id="main-nav">
    <a class="nav-logo" href="index.html" aria-label="ZIVARR"><img class="nav-logo-img" src="images/IMG_6489.JPG" alt="ZIVARR" /></a>
    <ul class="nav-links"><li><a href="collections.html">Collections</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li><li><a href="dashboard.html">Account</a></li></ul>
    <div class="nav-actions"><a href="login.html" class="btn-ghost">Login</a><button id="cartToggle" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 10h10l2-8H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg><span class="cart-dot">0</span></button></div>
  </nav>
  <main class="page-shell">
    <section class="page-wrap">
      <article class="glass-panel">
        <p class="eyebrow">Your Cart</p>
        <h1 class="title">Review your selections.</h1>
        <div id="cartItems" style="margin-top:16px;"></div>
        <p id="shippingNote" class="shipping-note"></p>
      </article>
      <article class="glass-panel">
        <p class="eyebrow">Order Summary</p>
        <div style="margin-top:16px;">
          <div class="summary-row"><span>Subtotal</span><strong id="subtotalAmount">₹0</strong></div>
          <div class="summary-row"><span>Shipping</span><strong id="shippingAmount">₹0</strong></div>
          <div class="summary-row"><span>Gift Wrap</span><strong id="giftWrapAmount">₹0</strong></div>
          <div class="summary-row total-row"><span>Total</span><strong id="totalAmount">₹0</strong></div>
        </div>
        <div class="cart-actions">
          <a class="btn-primary" href="checkout.html">Proceed to Checkout</a>
          <a class="btn-ghost" href="collections.html">Continue Shopping</a>
        </div>
        <div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:8px;">
          <div class="tag">Secure Payment</div>
          <div class="tag">Free Shipping ₹2,000+</div>
          <div class="tag">Easy Returns</div>
        </div>
      </article>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
