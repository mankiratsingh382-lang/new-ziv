<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Review your ZIVARR cart, check the pieces in your order, and continue to a secure premium checkout flow." />
  <meta name="robots" content="index,follow" />
  <meta name="author" content="ZIVARR" />
  <meta property="og:title" content="ZIVARR Cart | Luxury Jewellery" />
  <meta property="og:description" content="See your selected ZIVARR jewellery before you continue to checkout." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://zivarr.vercel.app/cart.html" />
  <meta property="og:image" content="https://zivarr.vercel.app/images/IMG_6489.JPG" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#b0505c" />
  <link rel="canonical" href="https://zivarr.vercel.app/cart.html" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>ZIVARR Cart | Luxury Jewellery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-shell{min-height:100svh;padding:110px 24px 72px;background:linear-gradient(180deg,#fffafc 0%,#fff 45%,#fff7f8 100%);}
    .page-wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start;}
    .glass-panel{background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border:1px solid rgba(212,114,126,.18);border-radius:28px;box-shadow:0 18px 50px rgba(61,24,32,.08);padding:28px 30px;}
    .eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--pink-mid);}
    .title{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,46px);color:var(--rose-dark);margin-top:6px;line-height:1.15;}
    .muted{color:var(--text-muted);font-size:13px;line-height:1.8;}

    .cart-item-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid rgba(212,114,126,.10);transition:opacity .3s;}
    .cart-item-row:last-child{border-bottom:none;}
    .cart-item-img{width:72px;height:72px;border-radius:16px;object-fit:cover;background:linear-gradient(145deg,#FDF0F2,#FAE8EB);border:1px solid rgba(212,114,126,.12);}
    .cart-item-img img{width:100%;height:100%;object-fit:cover;border-radius:16px;}
    .cart-item-details{min-width:0;}
    .cart-item-name{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--rose-dark);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cart-item-meta{font-size:12px;color:var(--text-muted);margin-top:3px;}
    .cart-item-controls{display:flex;align-items:center;gap:0;background:rgba(245,213,218,.2);border:1px solid rgba(212,114,126,.15);border-radius:12px;overflow:hidden;}
    .qty-button{width:36px;height:36px;border:none;background:transparent;color:var(--rose-dark);font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
    .qty-button:hover{background:rgba(245,213,218,.5);}
    .qty-value{font-size:14px;font-weight:600;min-width:28px;text-align:center;color:var(--rose-dark);font-family:'Jost',sans-serif;}
    .cart-item-total{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--rose-dark);font-weight:600;min-width:90px;text-align:right;white-space:nowrap;}
    .remove-item{background:none;border:none;color:var(--pink-mid);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;padding:4px 0;transition:color .2s;margin-top:6px;}
    .remove-item:hover{color:var(--pink-deep);}

    .empty-cart{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;line-height:1.8;}
    .empty-icon{font-size:56px;margin-bottom:16px;color:var(--pink-soft);opacity:.6;}
    .empty-title{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--rose-dark);margin-bottom:8px;}
    .empty-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;}
    .empty-cart .btn-primary{display:inline-block;}

    .summary-section{margin-bottom:20px;}
    .summary-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--pink-mid);margin-bottom:10px;font-weight:500;}
    .summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;}
    .summary-row span{font-size:13px;color:var(--text-muted);}
    .summary-row strong{color:var(--rose-dark);font-family:'Cormorant Garamond',serif;font-size:18px;}
    .total-row{border-top:2px solid rgba(212,114,126,.18);padding-top:14px;margin-top:4px;}
    .total-row span{font-size:15px;color:var(--rose-dark);font-weight:500;}
    .total-row strong{font-size:26px;font-family:'Cormorant Garamond',serif;font-weight:600;}

    .cart-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
    .cart-actions .btn-primary{flex:1;text-align:center;min-width:180px;padding:16px 28px;font-size:12px;letter-spacing:2px;}
    .cart-actions .btn-ghost{flex:0;text-align:center;min-width:140px;padding:16px 24px;font-size:11px;letter-spacing:1.5px;}

    .trust-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;}
    .trust-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(245,213,218,.18);border:1px solid rgba(212,114,126,.10);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--rose-mid);font-weight:500;}
    .trust-pill svg{width:14px;height:14px;fill:var(--pink-mid);}

    .divider{height:1px;background:rgba(212,114,126,.12);margin:6px 0;}

    @media (max-width:980px){
      .page-wrap{grid-template-columns:1fr;}
      .cart-item-row{grid-template-columns:auto 1fr auto;gap:12px;}
      .cart-item-total{grid-column:2/-1;text-align:right;min-width:auto;}
      .cart-actions .btn-primary{min-width:auto;}
    }
    @media (max-width:520px){
      .glass-panel{padding:20px 18px;border-radius:20px;}
      .cart-item-img{width:60px;height:60px;}
      .cart-item-name{font-size:17px;}
      .cart-item-total{font-size:17px;}
      .cart-actions{flex-direction:column;}
      .cart-actions a{width:100%;}
    }
  </style>
</head>
<body>
  <nav id="main-nav">
    <a class="nav-logo" href="index.html" aria-label="ZIVARR"><img class="nav-logo-img" src="images/IMG_6489.JPG" alt="ZIVARR" /></a>
    <ul class="nav-links"><li><a href="collections.html">Collections</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li><li><a href="dashboard.html">Account</a></li></ul>
    <div class="nav-actions"><button id="cartToggle" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 10h10l2-8H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg><span class="cart-dot">0</span></button></div>
  </nav>
  <main class="page-shell">
    <section class="page-wrap">
      <article class="glass-panel">
        <p class="eyebrow">Your Cart</p>
        <h1 class="title">Review your selections.</h1>
        <div id="cartItems" style="margin-top:8px;"></div>
      </article>
      <article class="glass-panel" id="summaryPanel">
        <div class="summary-section">
          <div class="summary-label">Order Summary</div>
          <div class="summary-row"><span>Subtotal</span><strong id="subtotalAmount">₹0</strong></div>
          <div class="summary-row" id="shippingRow"><span>Shipping</span><strong id="shippingAmount">₹0</strong></div>
          <div class="summary-row total-row"><span>Grand Total</span><strong id="totalAmount">₹0</strong></div>
        </div>
        <div class="cart-actions">
          <a class="btn-primary" href="checkout.html" id="checkoutBtn">Proceed to Checkout</a>
          <a class="btn-ghost" href="collections.html">Continue Shopping</a>
        </div>
        <div class="trust-row">
          <div class="trust-pill"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>Secure Payment</div>
          <div class="trust-pill"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Verified Quality</div>
        </div>
      </article>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
